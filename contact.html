<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Anime Voyage | Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="wrapper">

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">Anime Voyage</h1>
    </header>

    <!-- Navigation -->
<nav class="site-nav">
  <a href="index.html">Home</a>

  <details class="menu">
    <summary>Genres ▾</summary>
    <div class="menu-panel">
      <a href="romance.html">Romance</a>
      <a href="fantasy.html">Fantasy</a>
      <a href="action.html">Action</a>
      <a href="SOL.html">Slice of Life</a>
    </div>
  </details>

  <a href="contact.html">Contact</a>
</nav>

<script>
document.addEventListener("click", function(e){
  const menu = document.querySelector(".menu");
  if(menu && !menu.contains(e.target)){
    menu.removeAttribute("open");
  }
});
</script>




    <!-- Main Content -->
    <main>
      <section class="feature">
        <h2>Contact Anime Atlas</h2>
        <p>
          Have a recommendation, feedback, or question?  
          Fill out the form below and we’ll get back to you.
        </p>

        <form class="contact-form">
          <label for="name">Name</label><br>
          <input type="text" id="name" name="name" required><br><br>

          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" required><br><br>

        <label for="reason">Reason for Contact</label><br>
        <select id="reason" name="reason">
            <option value="">-- Select One --</option>
            <option value="question">General Question</option>
            <option value="recommend">Anime Recommendation</option>
            <option value="feedback">Website Feedback</option>
            <option value="other">Other</option>
</select>
<br><br>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="5" required></textarea><br><br>

          <input type="submit" value="Send Message">
        </form>
      </section>
    </main>

    <!-- Footer -->
  <footer>
  <p>
    Contact Anime Atlas:
    <a href="mailto:animeatlas@email.com">animeatlas@email.com</a>
  </p>

  <p>
    &copy; 2026 Anime Atlas
  </p>
</footer>

  </div>
</body>
</html>
